<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123b32">
<meta name="description" content="VUMOREN CONNECT – practical clean-energy planning, solar service enquiries and accessible technical learning.">
<title>VUMOREN CONNECT | Smart Energy & Education</title>
<style>
:root{--g:#123b32;--g2:#1d6652;--lime:#d8ef9b;--cream:#f6f7f1;--ink:#18231f;--muted:#66736d;--line:#dfe6df;--white:#fff;--gold:#fff5d8}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.6}
header{background:var(--g);color:white;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:0;z-index:10}
.brand{font-weight:800;font-size:18px;white-space:nowrap}.brand span{color:var(--lime)}
nav{display:flex;gap:12px;flex-wrap:wrap}nav a{color:white;text-decoration:none;font-size:13px}nav a:hover{text-decoration:underline;color:var(--lime)}
.hero{padding:58px 6%;background:linear-gradient(120deg,var(--g),var(--g2));color:white}
.hero-inner{max-width:1120px;margin:auto;display:grid;grid-template-columns:1.35fr .85fr;gap:28px;align-items:center}
.eyebrow{color:var(--lime);font-size:12px;font-weight:bold;letter-spacing:1.3px;text-transform:uppercase}
h1{font-size:clamp(34px,5vw,56px);line-height:1.1;margin:12px 0}.hero p{color:#e3eee8;font-size:17px}
.panel{background:#ffffff12;border:1px solid #ffffff30;border-radius:16px;padding:22px}.panel li{margin:8px 0}
.btn{display:inline-block;padding:11px 16px;border:0;border-radius:8px;font-weight:bold;text-decoration:none;cursor:pointer;margin:5px 5px 5px 0;font:inherit;font-weight:bold}
.primary{background:var(--lime);color:var(--g)}.secondary{background:transparent;border:1px solid white;color:white}
main{max-width:1120px;margin:auto;padding:28px 5% 60px}.section{padding:28px 0;scroll-margin-top:100px}
.heading{max-width:760px;margin-bottom:20px}.heading h2{color:var(--g);font-size:30px;margin:5px 0}.heading p,.card p{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid.two{grid-template-columns:repeat(2,1fr)}
.card{background:white;border:1px solid var(--line);border-radius:14px;padding:19px;box-shadow:0 5px 18px #163b2a08}
.card h3{color:var(--g);margin:7px 0}.icon{font-size:26px}
.calculator{display:grid;grid-template-columns:1fr 1fr;gap:20px}
label{display:block;font-weight:bold;font-size:14px;margin:12px 0 5px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd7ce;border-radius:8px;background:white;font:inherit;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g2);outline-offset:1px}
.result{background:var(--g);color:white;border-radius:14px;padding:20px}.big{font-size:30px;font-weight:bold;color:var(--lime)}
.note{background:var(--gold);border:1px solid #f0df9f;padding:13px;border-radius:9px;color:#65541d;font-size:13px;margin-top:15px}
.small{font-size:12px;color:var(--muted)}.resource{display:flex;flex-direction:column;gap:7px}.resource button{align-self:flex-start;background:var(--g);color:white}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.output{background:#eef5eb;border:1px solid #d5e5d4;border-radius:10px;padding:13px;margin-top:12px;min-height:50px}
.metric{font-size:24px;font-weight:bold;color:var(--g)}.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:10px;background:white}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{background:#edf3ed;color:var(--g)}
details{background:white;border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin:9px 0}summary{font-weight:bold;color:var(--g);cursor:pointer}
.status{display:inline-block;background:#edf3ed;color:var(--g);border-radius:20px;padding:3px 9px;font-size:11px;font-weight:bold}
footer{background:#102e27;color:#d9e6df;padding:28px 5%;text-align:center;font-size:13px}
